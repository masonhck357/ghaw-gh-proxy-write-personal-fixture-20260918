name: GHAW browser env fingerprint relay

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  relay:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.user.login == 'masonghbb' &&
      github.event.comment.author_association == 'NONE' &&
      github.event.comment.body == 'RUN_GHAW_BROWSER_ENV_TOKEN_20260919_71C6D4A92B35E80F'
    runs-on: ubuntu-latest
    steps:
      - name: Emit fixed relay marker
        run: printf '%s\n' 'bounded browser-env relay complete'
